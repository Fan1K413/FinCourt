name: fincourt-stack

services:
  fincourt-app:
    container_name: fincourt-app
    image: ${FINCOURT_STACK_IMAGE:-ghcr.io/fan1k413/fincourt:main}
    restart: unless-stopped
    init: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${FINCOURT_STACK_WEB_PORT:-8080}:8000"
      - "127.0.0.1:${FINCOURT_STACK_MCP_PORT:-8766}:8766"
    environment:
      FINCOURT_STACK_DB_PASSWORD: ${FINCOURT_STACK_DB_PASSWORD:?Set FINCOURT_STACK_DB_PASSWORD}
      FINCOURT_STORAGE_DIR: /app/var/write/storage
      FINCOURT_MODE: ${FINCOURT_STACK_MODE:-fixture}
      FINCOURT_SEED_EXAMPLES: ${FINCOURT_STACK_SEED_EXAMPLES:-true}
      FINCOURT_MCP_SECRET: ${FINCOURT_STACK_MCP_SECRET:?Set FINCOURT_STACK_MCP_SECRET}
      FINCOURT_ADMIN_TOKEN: ${FINCOURT_STACK_ADMIN_TOKEN:?Set FINCOURT_STACK_ADMIN_TOKEN}
      FINCOURT_NEXENT_BASE_URL: ${FINCOURT_STACK_NEXENT_BASE_URL:-}
      FINCOURT_NEXENT_API_TOKEN: ${FINCOURT_STACK_NEXENT_TOKEN:-}
      FINCOURT_NEXENT_AGENT_NAME: ${FINCOURT_STACK_NEXENT_AGENT:-}
      FINCOURT_NEXENT_RELEASE: ${FINCOURT_STACK_NEXENT_RELEASE:-}
    command: [python, deploy/serve.py]
    depends_on:
      fincourt-postgresql:
        condition: service_healthy
    volumes:
      - ./data/fincourt/evidence:/app/var/write/storage
      - ./data/fincourt/evidence:/app/var/mcp-storage:ro
      - ./data/fincourt/sources:/app/var/source
    networks: [fincourt-web, fincourt-data]
    healthcheck:
      test: [CMD, python, deploy/serve.py, health]
      interval: 10s
      timeout: 5s
      retries: 12

  fincourt-postgresql:
    container_name: fincourt-postgresql
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${FINCOURT_POSTGRES_ADMIN_PASSWORD:-}
      FINCOURT_STACK_DB_PASSWORD: ${FINCOURT_STACK_DB_PASSWORD:?Set FINCOURT_STACK_DB_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$$POSTGRES_PASSWORD" ]; then
          POSTGRES_PASSWORD="$$(od -An -N32 -tx1 /dev/urandom | tr -d '[:space:]')"
          export POSTGRES_PASSWORD
        fi
        exec docker-entrypoint.sh "$$@"
      - fincourt-postgresql
    command: [postgres]
    volumes:
      - ./data/fincourt/postgresql:/var/lib/postgresql/data
    configs:
      - source: fincourt-database
        target: /docker-entrypoint-initdb.d/10-fincourt-database.sh
    networks: [fincourt-data]
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$FINCOURT_STACK_DB_PASSWORD" psql -h 127.0.0.1 -U fincourt -d fincourt -Atqc "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 15

networks:
  fincourt-web: {}
  fincourt-data:
    internal: true

configs:
  fincourt-database:
    content: |
      psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
      \getenv fincourt_password FINCOURT_STACK_DB_PASSWORD
      CREATE ROLE fincourt LOGIN NOSUPERUSER NOCREATEROLE NOCREATEDB PASSWORD :'fincourt_password';
      CREATE DATABASE fincourt OWNER fincourt;
      REVOKE CONNECT ON DATABASE fincourt FROM PUBLIC;
      SQL
