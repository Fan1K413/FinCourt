server {
    listen 8443 ssl;
    server_name fincourt-nexent-gateway;
    ssl_certificate /run/fincourt-server/server.pem;
    ssl_certificate_key /run/fincourt-server/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/nb/v1/chat/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $northbound nexent-northbound:5013;
        proxy_pass http://$northbound;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    location / {
        return 404;
    }
}
