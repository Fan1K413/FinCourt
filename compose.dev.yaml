services:
  db:
    image: postgres:17.9
    environment:
      POSTGRES_DB: fincourt
      POSTGRES_USER: fincourt
      POSTGRES_PASSWORD: "${FINCOURT_POSTGRES_PASSWORD:?Set FINCOURT_POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fincourt-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincourt -d fincourt"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fincourt-db:
