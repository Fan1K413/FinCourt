[project]
name = "fincourt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "SQLAlchemy==2.0.46",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.2",
    "pypdfium2==5.10.1",
    "httpx==0.28.1",
    "mcp==1.26.0",
    "python-multipart==0.0.22",
    "tzdata==2025.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.15.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
